name: CrabBar
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  ClawdCore:
    path: Packages/ClawdCore
targets:
  CrabBar:
    type: application
    platform: macOS
    sources:
      - path: CrabBar
      - path: WidgetShared
    resources: []
    dependencies:
      - package: ClawdCore
      - target: CrabBarWidget
        embed: true
        codeSign: true
    info:
      path: CrabBar/Info.plist
      properties:
        CFBundleDisplayName: CrabBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSLocationUsageDescription: Clawd shows the sky above the mascot with the sun and the weather at your location.
        NSLocationWhenInUseUsageDescription: Clawd shows the sky above the mascot with the sun and the weather at your location.
        NSHumanReadableCopyright: Port of clawd-usage-winwidget by Venger Sergey (MIT)
        ClawdAppGroup: $(CLAWD_APP_GROUP_MAC)
        ClawdCloudContainer: $(CLAWD_ICLOUD_CONTAINER)
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).crabbar
            CFBundleURLSchemes: [crabbar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CrabBar
        PRODUCT_NAME: CrabBar
        # With or without iCloud (sync to the iPhone), chosen by CLAWD_ICLOUD in Config/Local.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(CLAWD_MAC_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: NO
  CrabBarWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: CrabBarWidget
      - path: WidgetShared
    dependencies:
      - package: ClawdCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: CrabBarWidget/CrabBarWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(CLAWD_APP_GROUP_MAC)
    info:
      path: CrabBarWidget/Info.plist
      properties:
        CFBundleDisplayName: CrabBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ClawdAppGroup: $(CLAWD_APP_GROUP_MAC)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CrabBar.Widget
        PRODUCT_NAME: CrabBarWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  CrabBariOS:
    type: application
    platform: iOS
    sources:
      - path: CrabBariOS
    dependencies:
      - package: ClawdCore
      - target: CrabBariOSWidget
        embed: true
        codeSign: true
    entitlements:
      path: CrabBariOS/CrabBariOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - $(CLAWD_ICLOUD_CONTAINER)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - $(CLAWD_APP_GROUP_IOS)
    info:
      path: CrabBariOS/Info.plist
      properties:
        CFBundleDisplayName: CrabBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Port of clawd-usage-winwidget by Venger Sergey (MIT)
        ClawdAppGroup: $(CLAWD_APP_GROUP_IOS)
        ClawdCloudContainer: $(CLAWD_ICLOUD_CONTAINER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CrabBariOS
        PRODUCT_NAME: CrabBar
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  CrabBariOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CrabBariOSWidget
      - path: WidgetShared
    dependencies:
      - package: ClawdCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: CrabBariOSWidget/CrabBariOSWidget.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - $(CLAWD_ICLOUD_CONTAINER)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - $(CLAWD_APP_GROUP_IOS)
    info:
      path: CrabBariOSWidget/Info.plist
      properties:
        CFBundleDisplayName: CrabBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ClawdAppGroup: $(CLAWD_APP_GROUP_IOS)
        ClawdCloudContainer: $(CLAWD_ICLOUD_CONTAINER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CrabBariOS.Widget
        PRODUCT_NAME: CrabBariOSWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CrabBar:
    build:
      targets:
        CrabBar: all
        CrabBarWidget: all
    run:
      config: Debug
  CrabBariOS:
    build:
      targets:
        CrabBariOS: all
        CrabBariOSWidget: all
    run:
      config: Debug
